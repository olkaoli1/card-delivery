plugins {
    id 'java'
}

group   = 'ru.netology'
version = '1.0-SNAPSHOT'

repositories { mavenCentral() }

dependencies {
    // Selenide и JUnit 5 подходят под Java 11
    testImplementation 'com.codeborne:selenide:6.19.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
    // флаг для headless-запуска в CI
    systemProperty 'selenide.headless', System.getProperty('headless')
}